    <script>
        // Accesibility
        // Text to Speech
        let lastElement = null;
        let lastWasTab = false;
        let synth;
        let previousKey = null;
        document.addEventListener('keydown', (e) => {
            lastWasTab = (['Enter', 'Tab'].indexOf(e.key) >= 0);
            previousKey = event.key;
        });
        function enableTabAutoRead(options = {}) {
            const {
                lang = 'en-US',
                rate = 1,
                pitch = 1,
                volume = 1,
                debug = false
            } = options;

            synth = window.speechSynthesis;

            function getReadableText(el) {
                if (!el) return '';
                const role = el.getAttribute('role') ||
                    el.tagName == "A" ? 'link' : '' ||
                        el.tagName == "BUTTON" ? 'button' : ''
                    ;
                // Priority: aria-label > innerText > value > alt > title
                const label = (
                    el.getAttribute('aria-label') ||
                    el.innerText ||
                    el.value ||
                    el.getAttribute('alt') ||
                    el.getAttribute('title') ||
                    ''
                ).trim();
                return role ? `${role}: ${label}` : label;
            }

            function speak(text) {
                if (!text) return;

                // Cancel previous speech to avoid overlap
                synth.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = rate;
                utterance.pitch = pitch;
                utterance.volume = volume;

                synth.speak(utterance);

                if (debug) console.log('🔊 Speaking:', text);
            }

            function handleFocus(event) {
                if (!lastWasTab) return;
                lastWasTab = false;
                if (event.target === lastElement) return;
                lastElement = event.target;
                const el = event.target;
                const text = getReadableText(el);

                if (debug) console.log('Focus on:', el, 'Text:', text);

                speak(text);
            }

            document.addEventListener('focusin', handleFocus);

            // Return a cleanup function
            return () => {
                document.removeEventListener('focusin', handleFocus);
                synth.cancel();
            };
        }

        const LANG_MAP = {
            '': 'en-US',
            'es-mx': 'es-ES',
        };
        const keyLang = /\/([^\/]*)$/.exec(location.pathname)[1];
        let disableTTS = null;
        // Accesibility menu activation
        document.addEventListener("DOMContentLoaded", function () {
            const elements = document.querySelectorAll('[wcag-menu-item]');
            elements.forEach((el, index) => {
                const wcagClass = el.getAttribute('data-wcag-class');
                el.setAttribute('tabindex', '-1');
                // Handle function
                const useValue = (val, wcagClass) => {
                    // Visual feedback on menu
                    el.setAttribute('wcag-used', val);

                    // Apply in document
                    if (wcagClass == "wcag_tts") {
                        if (val == "1") {
                            disableTTS = enableTabAutoRead({
                                lang: LANG_MAP[keyLang],
                                rate: 1.1,
                                debug: false
                            });
                        } else {
                            if (disableTTS != null) {
                                disableTTS();
                                disableTTS = null;
                            }
                        }
                    }
                    const body = document.querySelectorAll('body')[0];
                    Array.from(body.classList).forEach((cls) => {
                        if (cls.startsWith(wcagClass)) {
                            body.classList.remove(cls);
                        }
                    });
                    body.classList.add(`${wcagClass}_${val}`);
                };
                el.setAttribute('wcag-used', "0");
                Array.from(el.children).forEach((child) => {
                    const val = child.getAttribute('wcag-value');
                    if (!child.hasAttribute('tabindex')) {
                        child.setAttribute('tabindex', '0');
                    }
                    child.addEventListener('click', () => {
                        useValue(val, wcagClass);
                    });
                    // Keyboard listener (Enter key)
                    child.addEventListener('keydown', (event) => {
                        if (event.key === 'Enter') {
                            event.preventDefault();
                            useValue(val, wcagClass);
                        }
                    });
                });
            });
        });
    </script>
    <script>
        const ENV_ALL = {
            "dev": {
                "endpoint": "http://localhost:8081"
            },
            "stg": {

            },
            "pro": {
                "endpoint": "https://pro-nogales-web-flow-284609972807.us-central1.run.app"
            },
        };
        const DOMAIN_MAPPING = {
            "casa-de-la-familia-3c766f.webflow.io": "stg",
            "casadelafamilia.org": "pro",
        };
        let env = ENV_ALL["stg"];
        if (location.hostname in DOMAIN_MAPPING) {
            const currentEnv = DOMAIN_MAPPING[location.hostname];
            console.log(`using custom environment with ${currentEnv}`);
            env = ENV_ALL[currentEnv];
        }

        /**
         * en-us (default)
         * es-mx
         * */
        function getLanguage() {
            try {
                return document
                    .querySelector('[hreflang].w--current')
                    .getAttribute("hreflang")
                    .toLocaleLowerCase();
            } catch (err) {
                return "en-us";
            }
        }

        function translate(key, map) {
            const lan = getLanguage();
            if (key in map[lan]) {
                return map[lan][key];
            }
            return key;
        }

        function getTimestamp() {
            const now = new Date();
            return `${now.getDate()}-${now.getMonth() + 1}-${now.getFullYear()} / ${now.getUTCHours()}:${now.getUTCMinutes()}:${now.getUTCSeconds()}`;
        }

        function activateForm(parentId, formFunction, successMessage, errorMessage) {
            const parentForm = document.getElementById(parentId);
            if (!parentForm) {
                console.log(`Warning: No parent form with id "${parentId}"`);
                return;
            }
            const form = parentForm.querySelector("form");
            if (!form) {
                console.log(`Error: The div with id "${parentId}" has no form inner.`);
                return;
            }
            const eventFunction = async (e) => {
                console.log(`Firing form ${parentId}`);
                e.preventDefault();

                const formData = new FormData(form);
                const formDataFields = Object.fromEntries(formData.entries());
                try {
                    setLoadingIndicator(true);

                    const response = await formFunction(formDataFields);
                    if (response.successMessage) {
                        successMessage = response.successMessage;
                    }

                    // Show Webflow success message
                    form.style.display = "none";
                    parentForm.querySelector(".w-form-done").style.display = "block";

                    const selected = await showSuccessPopUp(successMessage);
                    console.log(`selected = ${selected}`);
                } catch (err) {
                    console.log(err);
                    const selected = await showErrorPopUp(errorMessage, err);
                    console.log(`selected = ${selected}`);
                    parentForm.querySelector(".w-form-fail").style.display = "block";
                }
            };
            form.addEventListener("submit", eventFunction);
            console.log(`Form ${parentId} activated!`);
        }
    </script>
    <script>
        const POPUP_IDS = {
            alert: 'popup_alert',
            confirm: 'popup_confirm',
            error: 'popup_alert',
            back: 'popup_back',
            loading: 'popup_loading',
        };
        function setElementVisibility(id, val) {
            const reference = document.getElementById(id);
            if (val) {
                reference.style.setProperty('display', 'block', 'important');
            } else {
                reference.style.setProperty('display', 'none', 'important');
            }
        }
        function setLoadingIndicator(val) {
            setElementVisibility(POPUP_IDS.back, val);
            setElementVisibility(POPUP_IDS.loading, val);
        }

        async function activatePopUp(id) {
            const reference = document.getElementById(id);
            // Clean previous
            const copyChildren = true;
            const newEl = reference.cloneNode(copyChildren);
            reference.parentNode.replaceChild(newEl, reference);
            return new Promise((resolve) => {
                newEl.querySelectorAll('[popup-action]').forEach(element => {
                    const handler = (event) => {
                        const clicked = event.currentTarget;
                        const action = clicked.getAttribute('popup-action');
                        if (action == "close") {
                            closeAllPopUps();
                        }
                        resolve(action);
                        element.removeEventListener('click', handler);
                    };
                    element.addEventListener('click', handler);
                });
            });
        }

        function mapPopUpContent(id, payloadMulti, err) {
            const lang = getLanguage();
            const payload = payloadMulti[lang];
            const reference = document.getElementById(id);
            const errorContainer = reference.querySelector('[popup-container]="error"');
            const detailLink = reference.querySelector('[popup-action]="see-detail"');
            const errorParagraph = reference.querySelector('[popup-content]="error"');
            //
            if (err) {
                // popup-container=error o -> display flex / none
                errorContainer.style.display = "flex";
                detailLink.addEventListener('click', () => {
                    if (errorParagraph.style.display == "none") {
                        errorParagraph.style.display = "block";
                    } else {
                        errorParagraph.style.display = "none";
                    }
                });
            } else {
                errorContainer.style.display = "none";
            }

            reference.querySelectorAll('[popup-content]').forEach(element => {
                const label = element.getAttribute('popup-content');
                if (label in payload) {
                    if (err && label == "error") {
                        element.innerHTML = `${err.message}`;
                    } else {
                        element.innerHTML = payload[label];
                    }
                }
            });
        }

        async function showSuccessPopUp(payload) {
            setLoadingIndicator(false);
            setElementVisibility(POPUP_IDS.back, true);
            // map content
            mapPopUpContent(POPUP_IDS.alert, payload);
            // make it visible
            setElementVisibility(POPUP_IDS.alert, true);
            // attach event listeners for buttons
            return activatePopUp(POPUP_IDS.alert);
        }

        async function showErrorPopUp(payload, err) {
            setLoadingIndicator(false);
            setElementVisibility(POPUP_IDS.back, true);
            // map content
            mapPopUpContent(POPUP_IDS.alert, payload, err);
            // make it visible
            setElementVisibility(POPUP_IDS.alert, true);
            // attach event listeners for buttons
            return activatePopUp(POPUP_IDS.alert);
        }

        async function showConfirmPopUp(payload) {
            setLoadingIndicator(false);
            setElementVisibility(POPUP_IDS.back, true);
            // map content
            mapPopUpContent(POPUP_IDS.confirm, payload);
            // make it visible
            setElementVisibility(POPUP_IDS.confirm, true);
            // attach event listeners for buttons
            return activatePopUp(POPUP_IDS.confirm);
        }

        function closeAllPopUps() {
            setElementVisibility(POPUP_IDS.back, false);
            setElementVisibility(POPUP_IDS.loading, false);
            setElementVisibility(POPUP_IDS.alert, false);
        }
    </script>

    <script>
        function configureDonations() {
            const buttonAmountIds = [
                "donate_25",
                "donate_50",
                "donate_100",
                "donate_500",
                "donate_other",
            ];
            const buttonReferences = {};
            let currentSelection = null;
            const updateSelectedColors = () => {
                Object.keys(buttonReferences).forEach((id) => {
                    const ref = buttonReferences[id];
                    if (id == currentSelection) {
                        ref.classList.add("selected_donation");
                    } else {
                        ref.classList.remove("selected_donation");
                    }
                });
            }
            buttonAmountIds.forEach((id) => {
                const buttonRef = document.getElementById(id);
                if (!buttonRef) {
                    console.log(`No button found for ${id}`);
                } else {
                    buttonReferences[id] = buttonRef;
                    buttonRef.addEventListener('click', () => {
                        currentSelection = id;
                        updateSelectedColors();
                    });
                }
            });

            const donateNowButton = document.getElementById("donate_now");
            if (donateNowButton) {
                donateNowButton.addEventListener('click', async () => {
                    if (!currentSelection) {
                        const selected = await showSuccessPopUp({
                            "en-us": {
                                title: "Oops",
                                message: "Please select an option.",
                                accept: "Ok",
                            },
                            "es-mx": {
                                title: "Ups",
                                message: "Por favor selecciona una opción.",
                                accept: "Aceptar",
                            }
                        });
                    } else {
                        //grab the url from the button
                        const referenceButton = buttonReferences[currentSelection];
                        const destination = referenceButton.getAttribute("data-url");
                        if (destination) {
                            window.open(destination, "_blank");
                            currentSelection = null;
                            updateSelectedColors();
                        }
                    }
                });
            }
        }
        document.addEventListener("DOMContentLoaded", () => {
            configureDonations();
        });
    </script>
